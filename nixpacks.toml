[phases.setup]
nixPkgs = ["php83", "php83Extensions.intl", "php83Extensions.zip", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "composer"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-interaction --no-scripts"]

[phases.build]
cmds = ["php artisan key:generate --force"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"

[variables]
NIXPACKS_PHP_FALLBACK_VERSION = "8.3"
PHP_VERSION = "8.3"
